<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Shared JavaScript -->

  {% endif %}
</body>
</html>
